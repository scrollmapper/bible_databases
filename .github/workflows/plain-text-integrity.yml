name: Plain text integrity
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid downloading 8+ GB of unrelated generated exports.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /sources/*/*/*.json
            !/sources/*/*/*-osis.json
            /sources/zh-hant/ChiUn/ChiUn-osis.json
            /sources/zh-hant/ChiUn/ChiUn.zip
            /formats/*/ChiUn.*
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pysword pyarrow PyYAML
      - run: python -m unittest discover -s tests -p 'test_plain_text_markup.py' -v
      - run: python scripts/verify_plain_text_markup.py
